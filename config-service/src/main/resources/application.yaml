spring:
  application:
    name: config-server

  cloud:
    config.server.git:
      uri: https://github.com/PreetamSingh18/distributed_razorpay_config
      username: PreetamSingh18
      password: ${CONFIG_SERVER_GIT_PASSWORD}
      default-label: main

   
server.port: 8888

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    config:
      enabled: false
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  metrics:
    tags:
      application: ${spring.application.name}
